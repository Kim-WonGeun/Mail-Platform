# 모든 환경에서 공통으로 사용하는 설정입니다.
spring:
  application:
    name: mail-platform-api
  # 프로필을 지정하지 않으면 dev로 실행합니다.
  # 운영 환경에서는 SPRING_PROFILES_ACTIVE 환경 변수로 프로필을 바꿉니다.
  profiles:
    default: dev
  # 접속 정보는 환경 변수로 받고, 로컬 값은 application-dev.yml에 둡니다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # 테이블은 Flyway만 만들고, JPA는 엔티티와 테이블이 맞는지만 확인합니다.
    hibernate:
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 연결을 붙잡지 않도록 끕니다.
    open-in-view: false
  flyway:
    # src/main/resources/db/migration의 SQL 파일을 버전 순서대로 실행합니다.
    locations: classpath:db/migration

server:
  port: 8080
