apiVersion: apps/v1
# StatefulSet은 DB처럼 상태(데이터)를 가진 애플리케이션을 위한 리소스입니다.
# Deployment와 달리 Pod 이름이 mail-platform-postgres-0 처럼 고정되고,
# Pod가 다시 만들어져도 같은 PVC(저장소)에 다시 연결됩니다.
kind: StatefulSet
# metadata는 이 Kubernetes 리소스의 이름, namespace, 라벨 같은 식별 정보를 담습니다.
metadata:
  name: mail-platform-postgres
  namespace: mail-platform
  labels:
    app.kubernetes.io/name: mail-platform-postgres
    app.kubernetes.io/part-of: mail-platform
# spec은 StatefulSet이 유지해야 하는 "원하는 상태"를 정의합니다.
spec:
  # 이 StatefulSet의 Pod 네트워크 이름을 담당하는 Service입니다.
  serviceName: mail-platform-postgres
  # DB는 복제 구성 없이 1개만 실행합니다.
  replicas: 1
  # selector는 StatefulSet이 관리할 Pod를 고르는 조건입니다.
  # template.metadata.labels와 맞아야 합니다.
  selector:
    matchLabels:
      app.kubernetes.io/name: mail-platform-postgres
  # template은 StatefulSet이 새로 만들 Pod의 설계도입니다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail-platform-postgres
        app.kubernetes.io/part-of: mail-platform
    spec:
      containers:
        - name: postgres
          # 로컬 Docker Compose와 같은 PostgreSQL 17 이미지를 사용합니다.
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          # envFrom은 Secret의 모든 key를 같은 이름의 환경 변수로 넣습니다.
          # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD가 컨테이너에 전달됩니다.
          envFrom:
            - secretRef:
                name: mail-platform-postgres
          # 실제 데이터 파일을 마운트 경로 아래 하위 폴더에 둡니다.
          # 마운트 루트에 다른 파일이 있어도 초기화가 실패하지 않게 하는 관례입니다.
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # 아래 volumeClaimTemplates로 만든 PVC를 컨테이너 안 경로에 연결합니다.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # pg_isready로 DB가 접속을 받을 수 있는지 확인합니다.
          # Ready가 되기 전에는 Service가 이 Pod로 트래픽을 보내지 않습니다.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          # 계속 응답하지 않으면 컨테이너를 재시작합니다.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  # volumeClaimTemplates는 Pod마다 PVC(PersistentVolumeClaim)를 하나씩 만들어 줍니다.
  # 생성되는 PVC 이름은 data-mail-platform-postgres-0 입니다.
  # StatefulSet을 지워도 PVC는 남으므로 데이터가 보존됩니다.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # 한 노드에서만 읽고 쓸 수 있는 볼륨을 요청합니다.
        accessModes: ["ReadWriteOnce"]
        # storageClassName을 생략하면 클러스터의 기본 StorageClass를 사용합니다.
        resources:
          requests:
            storage: 1Gi
