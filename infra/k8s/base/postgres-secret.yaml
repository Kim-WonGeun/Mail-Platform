apiVersion: v1
# Secret은 비밀번호처럼 민감한 값을 Pod 설정과 분리해 보관하는 리소스입니다.
kind: Secret
# metadata는 이 Kubernetes 리소스의 이름, namespace, 라벨 같은 식별 정보를 담습니다.
metadata:
  # PostgreSQL과 API가 함께 참조하는 DB 접속 정보입니다.
  name: mail-platform-postgres
  namespace: mail-platform
  labels:
    app.kubernetes.io/name: mail-platform-postgres
    app.kubernetes.io/part-of: mail-platform
# Opaque는 사용자가 임의의 key-value를 담는 기본 Secret 타입입니다.
type: Opaque
# stringData에는 평문으로 적고, 저장될 때 Kubernetes가 base64로 바꿔 data에 넣습니다.
# base64는 암호화가 아니므로 Secret 조회 권한 관리가 중요합니다.
# 아래 값은 infra/docker/compose.yaml과 같은 로컬 실습용 값입니다.
# 실제 운영 환경에서는 저장소에 커밋하지 않고 외부 Secret 관리 도구로 주입합니다.
stringData:
  # postgres 이미지가 처음 시작될 때 이 값으로 DB와 사용자를 만듭니다.
  POSTGRES_DB: mail_platform
  POSTGRES_USER: mail_platform
  POSTGRES_PASSWORD: mail_platform
