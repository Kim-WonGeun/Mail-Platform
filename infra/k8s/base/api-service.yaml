apiVersion: v1
kind: Service
# metadata는 이 Kubernetes 리소스의 이름, namespace, 라벨 같은 식별 정보를 담습니다.
metadata:
  # API Pod 앞에 붙는 고정 네트워크 이름입니다.
  name: mail-platform-api
  namespace: mail-platform
  # labels는 이 Service 자체를 분류하거나 조회할 때 쓰는 표식입니다.
  labels:
    app.kubernetes.io/name: mail-platform-api
    app.kubernetes.io/part-of: mail-platform
# spec은 Service의 네트워크 동작을 정의합니다.
# 어떤 Pod로 트래픽을 보낼지, 어떤 포트를 열지, 어떤 타입으로 노출할지 적습니다.
spec:
  # ClusterIP는 클러스터 내부에서만 접근 가능한 Service 타입입니다.
  # 같은 namespace 안에서는 http://mail-platform-api:8080 으로 접근할 수 있습니다.
  type: ClusterIP
  # selector는 Service가 트래픽을 전달할 Pod를 고르는 조건입니다.
  selector:
    # 이 라벨이 붙은 Pod로 트래픽을 전달합니다.
    app.kubernetes.io/name: mail-platform-api
  # ports는 Service 포트와 실제 Pod 포트의 연결 규칙입니다.
  ports:
    - name: http
      # Service가 열어주는 포트입니다.
      port: 8080
      # 실제 Pod 컨테이너의 포트 이름입니다.
      targetPort: http
