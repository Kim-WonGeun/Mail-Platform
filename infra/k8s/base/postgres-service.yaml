apiVersion: v1
kind: Service
# metadata는 이 Kubernetes 리소스의 이름, namespace, 라벨 같은 식별 정보를 담습니다.
metadata:
  # PostgreSQL Pod 앞에 붙는 고정 네트워크 이름입니다.
  # API는 jdbc:postgresql://mail-platform-postgres:5432 로 접속합니다.
  name: mail-platform-postgres
  namespace: mail-platform
  labels:
    app.kubernetes.io/name: mail-platform-postgres
    app.kubernetes.io/part-of: mail-platform
# spec은 Service의 네트워크 동작을 정의합니다.
spec:
  # ClusterIP라서 클러스터 밖에서는 DB에 직접 접근할 수 없습니다.
  # 로컬에서 직접 접속하려면 kubectl port-forward를 사용합니다.
  type: ClusterIP
  # 이 라벨이 붙은 PostgreSQL Pod로 트래픽을 전달합니다.
  selector:
    app.kubernetes.io/name: mail-platform-postgres
  ports:
    - name: postgres
      # Service가 열어주는 포트입니다.
      port: 5432
      # 실제 Pod 컨테이너의 포트 이름입니다.
      targetPort: postgres
